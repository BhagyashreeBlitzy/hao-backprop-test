# =============================================================================
# Nginx Reverse Proxy Configuration for Node.js Tutorial Application
# =============================================================================
#
# This configuration file sets up Nginx as a reverse proxy for the Node.js
# Express.js tutorial application, implementing production-ready best practices
# for HTTP request forwarding, error handling, and security.
#
# Educational Purpose:
# This configuration demonstrates fundamental Nginx reverse proxy patterns
# suitable for Node.js applications, with comprehensive documentation for
# learning deployment and infrastructure concepts.
#
# Target Backend:
# - Node.js Express.js application on localhost:3000
# - Single /hello endpoint returning "Hello world"
# - Stateless application supporting horizontal scaling
#
# Key Features:
# - HTTP request proxying to Node.js backend
# - WebSocket and HTTP/1.1 upgrade support
# - Security headers for protection against common vulnerabilities
# - Static error page handling for graceful degradation
# - Performance optimization with timeouts and buffering
# - Educational comments for learning infrastructure concepts
#
# Deployment Scenarios:
# - Local development environments
# - Simple production deployments
# - Containerized applications (Docker)
# - Educational infrastructure demonstrations
#
# Version: 1.0.0
# Compatible with: Nginx 1.18+ and Node.js v22.x LTS
# =============================================================================

# Event processing configuration
events {
    # Maximum number of simultaneous connections per worker process
    # Optimized for tutorial application with moderate load expectations
    worker_connections 1024;
    
    # Use epoll for efficient event handling on Linux systems
    # Improves performance for concurrent connections
    use epoll;
    
    # Accept multiple connections simultaneously
    # Reduces latency and improves throughput
    multi_accept on;
}

# HTTP server configuration block
http {
    # ==========================================================================
    # BASIC HTTP CONFIGURATION
    # ==========================================================================
    
    # Include MIME types for proper content type handling
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Server identification configuration
    # Hide Nginx version for security (information disclosure prevention)
    server_tokens off;
    
    # ==========================================================================
    # PERFORMANCE OPTIMIZATION SETTINGS
    # ==========================================================================
    
    # Enable efficient file serving using sendfile system call
    # Improves performance for static file delivery
    sendfile on;
    
    # Send headers and file content in single packet when possible
    # Reduces network overhead and improves response times
    tcp_nopush on;
    
    # Disable Nagle's algorithm for low-latency communication
    # Improves responsiveness for small data transfers
    tcp_nodelay on;
    
    # Connection keep-alive timeout
    # Balances connection reuse with resource management
    keepalive_timeout 65;
    
    # ==========================================================================
    # SECURITY CONFIGURATION
    # ==========================================================================
    
    # Default security headers applied to all responses
    # These headers provide baseline protection against common web vulnerabilities
    
    # Prevent MIME type sniffing attacks
    # Forces browsers to respect declared content types
    add_header X-Content-Type-Options "nosniff" always;
    
    # Clickjacking protection using frame options
    # Prevents embedding in frames from different origins
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # XSS protection for legacy browsers
    # Enables browser's built-in XSS filtering
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer policy for privacy protection
    # Controls how much referrer information is shared
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # ==========================================================================
    # LOGGING CONFIGURATION
    # ==========================================================================
    
    # Custom log format for detailed request tracking
    # Includes timing, user agent, and proxy-specific information
    log_format tutorial_access '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              '$request_time $upstream_response_time';
    
    # Access log location with custom format
    access_log /var/log/nginx/tutorial_access.log tutorial_access;
    
    # Error log with info level for troubleshooting
    error_log /var/log/nginx/tutorial_error.log info;
    
    # ==========================================================================
    # UPSTREAM BACKEND DEFINITION
    # ==========================================================================
    
    # Define the Node.js backend server pool
    # Supports future load balancing and health checking
    upstream nodejs_backend {
        # Primary Node.js Express.js server
        # Default configuration from backend/config/server.js
        server localhost:3000;
        
        # Health check and failover configuration
        # Automatically removes unhealthy servers from rotation
        max_fails 3;          # Mark server as failed after 3 consecutive failures
        fail_timeout 30s;     # Wait 30 seconds before retrying failed server
        
        # Connection optimization
        keepalive 32;         # Maintain persistent connections to backend
        keepalive_requests 100; # Reuse connections for multiple requests
    }
    
    # ==========================================================================
    # MAIN SERVER BLOCK
    # ==========================================================================
    
    server {
        # HTTP server listening configuration
        # Binds to port 80 for standard HTTP traffic
        listen 80 default_server;
        listen [::]:80 default_server;  # IPv6 support
        
        # Server name configuration
        # Accepts requests for any hostname (suitable for tutorial/development)
        server_name _;
        
        # Root directory for static error pages
        # Contains custom error pages for graceful degradation
        root /usr/share/nginx/html;
        
        # Default index files
        index index.html index.htm;
        
        # ======================================================================
        # MAIN PROXY LOCATION BLOCK
        # ======================================================================
        
        # Primary location block for all application traffic
        # Proxies all requests to the Node.js Express.js backend
        location / {
            # -------------------------------------------------------------------
            # UPSTREAM PROXY CONFIGURATION
            # -------------------------------------------------------------------
            
            # Forward requests to the Node.js backend pool
            proxy_pass http://nodejs_backend;
            
            # Use HTTP/1.1 for backend communication
            # Required for connection keep-alive and WebSocket upgrades
            proxy_http_version 1.1;
            
            # -------------------------------------------------------------------
            # WEBSOCKET AND UPGRADE SUPPORT
            # -------------------------------------------------------------------
            
            # WebSocket upgrade header forwarding
            # Enables real-time communication support for future extensions
            proxy_set_header Upgrade $http_upgrade;
            
            # Connection header for WebSocket and keep-alive support
            # Conditional value based on upgrade header presence
            proxy_set_header Connection $connection_upgrade;
            
            # -------------------------------------------------------------------
            # CLIENT INFORMATION HEADERS
            # -------------------------------------------------------------------
            
            # Preserve original Host header
            # Ensures backend receives correct hostname information
            proxy_set_header Host $host;
            
            # Forward real client IP address
            # Essential for logging, security, and analytics
            proxy_set_header X-Real-IP $remote_addr;
            
            # Forward complete IP chain for proxy transparency
            # Maintains visibility of complete request path
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Protocol information for backend awareness
            # Helps backend generate correct URLs and security policies
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # -------------------------------------------------------------------
            # TIMEOUT AND BUFFERING CONFIGURATION
            # -------------------------------------------------------------------
            
            # Connection timeout to backend server
            # Prevents hanging connections during backend startup
            proxy_connect_timeout 5s;
            
            # Read timeout for backend response
            # Balances responsiveness with backend processing time
            proxy_read_timeout 60s;
            
            # Send timeout for request transmission
            # Ensures requests complete within reasonable time
            proxy_send_timeout 60s;
            
            # Response buffering configuration
            # Optimizes memory usage while maintaining performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Temporary file configuration for large responses
            proxy_temp_file_write_size 8k;
            
            # -------------------------------------------------------------------
            # CLIENT REQUEST LIMITS
            # -------------------------------------------------------------------
            
            # Maximum request body size
            # Prevents large payload attacks while supporting typical use cases
            client_max_body_size 2m;
            
            # Client timeout configuration
            # Prevents resource exhaustion from slow clients
            client_body_timeout 10s;
            client_header_timeout 10s;
        }
        
        # ======================================================================
        # HEALTH CHECK ENDPOINT
        # ======================================================================
        
        # Health check endpoint for monitoring and load balancing
        # Provides direct Nginx status without backend dependency
        location /nginx-health {
            # Return simple status response
            return 200 "Nginx proxy healthy\n";
            
            # Set appropriate content type
            add_header Content-Type text/plain;
            
            # Disable logging for health checks to reduce noise
            access_log off;
        }
        
        # ======================================================================
        # STATIC ERROR PAGE CONFIGURATION
        # ======================================================================
        
        # Custom error page for client errors (4xx)
        # Provides user-friendly error messages for common issues
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;  # Prevent direct access to error page
        }
        
        # Custom error page for server errors (5xx)
        # Handles backend unavailability and proxy errors gracefully
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;  # Prevent direct access to error page
        }
        
        # ======================================================================
        # SECURITY ENHANCEMENTS
        # ======================================================================
        
        # Deny access to hidden files and directories
        # Prevents access to configuration files and system directories
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Security headers for all locations
        # Additional protection beyond default headers
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            # Cache control for static assets
            expires 1d;
            add_header Cache-Control "public, immutable";
            
            # Security headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }
    }
    
    # ==========================================================================
    # CONNECTION UPGRADE MAP
    # ==========================================================================
    
    # Map for WebSocket connection upgrade handling
    # Enables conditional Connection header based on Upgrade presence
    map $http_upgrade $connection_upgrade {
        default upgrade;     # Set to 'upgrade' when Upgrade header present
        ''      close;       # Set to 'close' when no Upgrade header
    }
}

# =============================================================================
# CONFIGURATION NOTES AND DEPLOYMENT GUIDANCE
# =============================================================================

# Deployment Instructions:
# 1. Copy this file to /etc/nginx/nginx.conf or include in main configuration
# 2. Ensure Node.js application is running on localhost:3000
# 3. Create custom error pages in /usr/share/nginx/html/
# 4. Test configuration: nginx -t
# 5. Reload Nginx: systemctl reload nginx
#
# For Docker deployment:
# 1. Mount this file as a volume: -v ./nginx.conf:/etc/nginx/nginx.conf
# 2. Ensure backend service is accessible at nodejs_backend hostname
# 3. Update upstream definition for container networking
#
# Environment Variables Support:
# - BACKEND_HOST: Override default localhost for backend connection
# - BACKEND_PORT: Override default 3000 for backend port
# - CLIENT_MAX_BODY_SIZE: Override default 2m limit
#
# Security Considerations:
# - Regularly update Nginx to latest stable version
# - Monitor access logs for suspicious activity
# - Implement rate limiting for production deployments
# - Consider SSL/TLS termination for production use
#
# Performance Tuning:
# - Adjust worker_connections based on expected load
# - Monitor memory usage and adjust buffer sizes
# - Implement caching for static assets in production
# - Consider compression for text-based responses
#
# Monitoring Integration:
# - Access logs compatible with standard log analysis tools
# - Error logs provide detailed troubleshooting information
# - Health check endpoint supports automated monitoring
# - Response time logging enables performance analysis
#
# Educational Value:
# This configuration demonstrates:
# - Reverse proxy fundamentals and best practices
# - WebSocket and HTTP/1.1 upgrade support
# - Security header implementation
# - Error handling and graceful degradation
# - Performance optimization techniques
# - Production-ready monitoring and logging