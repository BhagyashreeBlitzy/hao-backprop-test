# Global nginx configuration
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Events block for connection handling
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# Main HTTP configuration block
http {
    # Logging configuration with detailed request/response information
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    # Basic HTTP settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    send_timeout 60;
    types_hash_max_size 2048;
    
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Client request limits
    client_max_body_size 1m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private must-revalidate;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # Upstream backend definition pointing to Docker Compose service
    upstream backend {
        server backend:3000;
        keepalive 32;
    }
    
    # Main server block for HTTP routing
    server {
        # Listen on port 80 for all IPv4 and IPv6 addresses
        listen 80 default_server;
        listen [::]:80 default_server;
        
        # Server name configuration (catch-all)
        server_name _;
        
        # Security headers for all responses
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy no-referrer always;
        
        # Remove server information header
        server_tokens off;
        
        # Health check endpoint - high priority for monitoring
        location /health {
            # Proxy to backend health endpoint
            proxy_pass http://backend/health;
            
            # Proxy headers for correct client information forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Fast timeouts for health checks
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            
            # Enable connection reuse
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Disable caching for health checks
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            
            # Access log for health check monitoring
            access_log /var/log/nginx/access.log main;
        }
        
        # Hello endpoint - main application endpoint
        location /hello {
            # Proxy to backend hello endpoint
            proxy_pass http://backend/hello;
            
            # Proxy headers for correct client information forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Standard timeouts for application requests
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            
            # Enable connection reuse
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Limit to GET method only
            limit_except GET {
                deny all;
            }
            
            # Enable response buffering for efficiency
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
        
        # Root location - proxy all other requests to backend
        location / {
            # Proxy to backend root
            proxy_pass http://backend;
            
            # Proxy headers for correct client information forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_Set_header X-Forwarded-Proto $scheme;
            
            # Standard timeouts for general requests
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            
            # Enable connection reuse
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Enable response buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Error handling - let backend handle 404s
            proxy_intercept_errors off;
        }
        
        # Custom error pages configuration
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        # Serve custom 404 error page
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        
        # Serve custom 50x error pages
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        
        # Security: Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Security: Deny access to backup files
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Optional: Serve robots.txt if present
        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
        }
        
        # Optional: Serve favicon.ico if present
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }
    }
    
    # Server block for handling invalid hosts (security)
    server {
        listen 80;
        listen [::]:80;
        server_name "";
        return 444;
    }
}