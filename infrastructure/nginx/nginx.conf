# NGINX Configuration for Node.js Tutorial Backend Reverse Proxy
# Version: 1.0.0
# Description: Production-ready reverse proxy configuration for routing HTTP traffic
# from port 80 to the backend Node.js/Express.js service on port 3000

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Logging configuration with detailed request/response information
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    # Basic HTTP configuration
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    send_timeout 60;
    client_max_body_size 1m;
    
    # Compression settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
    
    # Upstream backend configuration
    # Points to the backend service (Docker Compose service name and port)
    upstream backend {
        server backend:3000;
        keepalive 32;
    }
    
    # Main server block for HTTP traffic routing
    server {
        # Listen on port 80 for both IPv4 and IPv6
        listen 80 default_server;
        listen [::]:80 default_server;
        
        # Catch-all server name
        server_name _;
        
        # Security headers - applied to all responses
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy no-referrer always;
        
        # Remove server signature for security
        server_tokens off;
        
        # Health check endpoint - optimized for fast response
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Fast timeouts for health checks
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 5s;
            
            # Health check specific optimizations
            proxy_buffering off;
            proxy_cache off;
            
            # Allow all HTTP methods for health checks
            limit_except GET HEAD POST PUT DELETE PATCH OPTIONS {
                deny all;
            }
        }
        
        # Hello endpoint - main application endpoint
        location /hello {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Standard timeouts for application endpoints
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
            
            # HTTP/1.1 support for keep-alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Restrict to GET requests only for hello endpoint
            limit_except GET {
                deny all;
            }
        }
        
        # Root and all other paths - proxy to backend
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Standard timeouts for all other requests
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
            
            # HTTP/1.1 support for keep-alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Enable proxy buffering for better performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Allow all HTTP methods for general endpoints
            # Backend will handle method validation and 404 responses
        }
        
        # Custom error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        # Serve custom 404 error page
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # Serve custom 50x error pages
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # Security: Block access to hidden files and directories
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Security: Block access to backup files
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Favicon handling to prevent 404 errors
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }
        
        # Robots.txt handling
        location = /robots.txt {
            log_not_found off;
            access_log off;
        }
    }
}