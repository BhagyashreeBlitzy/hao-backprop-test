# Node.js Tutorial Backend CI/CD Pipeline
# 
# This GitHub Actions workflow automates the continuous integration and deployment pipeline
# for the Node.js tutorial backend application. It provides comprehensive testing, security
# auditing, and quality assurance for the Express.js 5.1.0 application across multiple
# Node.js LTS versions.
#
# Features:
# - Multi-version Node.js compatibility testing (18.x, 20.x, 22.x LTS)
# - Comprehensive test suite execution with Jest and Supertest
# - Code coverage collection and threshold enforcement
# - Security vulnerability scanning with npm audit
# - Dependency caching for improved performance
# - Production-ready validation and quality gates
# - Educational clarity with extensive documentation
#
# Triggers:
# - Push events to main branch
# - Pull request events targeting main branch
# - Manual workflow dispatch for testing
#
# @version 1.0.0
# @requires node@18+
# @requires npm@11.4.2+
# @author Node.js Tutorial Team
# @since 2024-01-01

name: Node.js Tutorial Backend CI

# Workflow trigger configuration
# Ensures CI runs on all code changes to maintain quality and security
on:
  # Trigger on push to main branch for continuous integration
  push:
    branches: 
      - main
      - develop  # Include develop branch for feature integration
    paths:
      - 'src/backend/**'  # Only run when backend code changes
      - '.github/workflows/ci.yml'  # Re-run when CI configuration changes
      - 'package*.json'  # Run when dependencies change
  
  # Trigger on pull requests targeting main branch for quality gates
  pull_request:
    branches: 
      - main
    paths:
      - 'src/backend/**'
      - '.github/workflows/ci.yml'
      - 'package*.json'
  
  # Allow manual workflow dispatch for testing and validation
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: boolean

# Global environment variables for consistent configuration
env:
  NODE_ENV: test
  CI: true
  FORCE_COLOR: 3  # Enable colored output for better readability
  NPM_CONFIG_PROGRESS: false  # Disable npm progress bar for cleaner logs

# Define workflow jobs
jobs:
  # Main testing job with matrix strategy for multiple Node.js versions
  test:
    name: Test Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    
    # Matrix strategy for multi-version compatibility testing
    # Ensures compatibility with all supported Node.js LTS versions
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']
      fail-fast: false  # Continue testing other versions if one fails
    
    # Default working directory for all steps
    defaults:
      run:
        working-directory: src/backend
    
    # Job execution steps
    steps:
      # Step 1: Repository checkout
      # Uses GitHub's official checkout action to retrieve source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for better git operations
          fetch-depth: 0
      
      # Step 2: Node.js environment setup
      # Configures Node.js runtime with specified version and npm caching
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'
          registry-url: 'https://registry.npmjs.org'
          # Optimize npm configuration for CI environment
          always-auth: false
      
      # Step 3: Dependency installation
      # Uses npm ci for reproducible builds with locked dependencies
      - name: Install dependencies
        run: |
          echo "::group::Installing dependencies"
          echo "📦 Installing dependencies using npm ci for reproducible builds"
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Working directory: $(pwd)"
          
          # Install dependencies with ci command for reproducible builds
          npm ci --prefer-offline --no-audit --no-fund
          
          echo "✅ Dependencies installed successfully"
          echo "::endgroup::"
      
      # Step 4: Dependency verification
      # Verifies that all required dependencies are properly installed
      - name: Verify dependencies
        run: |
          echo "::group::Verifying dependencies"
          echo "🔍 Verifying critical dependencies are installed"
          
          # Check for essential dependencies
          npm list express --depth=0 || echo "⚠️ Express.js not found"
          npm list jest --depth=0 || echo "⚠️ Jest not found"
          npm list supertest --depth=0 || echo "⚠️ Supertest not found"
          
          # Display installed dependency versions
          echo "📋 Installed versions:"
          node -e "const pkg = require('./package.json'); console.log(\`Express.js: \${pkg.dependencies.express}\`);"
          node -e "const pkg = require('./package.json'); console.log(\`Jest: \${pkg.devDependencies.jest}\`);"
          node -e "const pkg = require('./package.json'); console.log(\`Supertest: \${pkg.devDependencies.supertest}\`);"
          
          echo "✅ Dependency verification complete"
          echo "::endgroup::"
      
      # Step 5: Code linting
      # Runs ESLint to ensure code quality and consistency
      - name: Run code linting
        run: |
          echo "::group::Running code linting"
          echo "🔍 Running ESLint for code quality validation"
          
          # Run ESLint with configuration from package.json
          npm run lint
          
          echo "✅ Code linting passed"
          echo "::endgroup::"
      
      # Step 6: Code formatting check
      # Validates code formatting with Prettier
      - name: Check code formatting
        run: |
          echo "::group::Checking code formatting"
          echo "🎨 Validating code formatting with Prettier"
          
          # Check if code formatting is consistent
          npm run format:check
          
          echo "✅ Code formatting validation passed"
          echo "::endgroup::"
      
      # Step 7: Test execution
      # Runs the complete test suite with coverage collection
      - name: Run tests with coverage
        run: |
          echo "::group::Running test suite"
          echo "🧪 Executing comprehensive test suite with coverage"
          echo "Test environment: $NODE_ENV"
          echo "Jest configuration: $(pwd)/jest.config.js"
          
          # Run tests with coverage using the custom test script
          npm run test:ci
          
          echo "✅ Test execution completed successfully"
          echo "::endgroup::"
      
      # Step 8: Coverage validation
      # Validates that coverage thresholds are met
      - name: Validate coverage thresholds
        run: |
          echo "::group::Validating coverage thresholds"
          echo "📊 Checking coverage against defined thresholds"
          
          # Display coverage summary
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "📈 Coverage Summary:"
            node -e "
              const coverage = require('./coverage/coverage-summary.json');
              const total = coverage.total;
              console.log(\`Lines: \${total.lines.pct}% (threshold: 80%)\`);
              console.log(\`Functions: \${total.functions.pct}% (threshold: 90%)\`);
              console.log(\`Branches: \${total.branches.pct}% (threshold: 70%)\`);
              console.log(\`Statements: \${total.statements.pct}% (threshold: 80%)\`);
            "
          else
            echo "⚠️ Coverage summary not found"
          fi
          
          echo "✅ Coverage validation complete"
          echo "::endgroup::"
      
      # Step 9: Security audit
      # Runs npm audit to identify security vulnerabilities
      - name: Run security audit
        run: |
          echo "::group::Running security audit"
          echo "🔒 Scanning dependencies for security vulnerabilities"
          echo "Using npm audit for vulnerability detection"
          
          # Run npm audit and capture output
          if npm audit --audit-level=moderate; then
            echo "✅ No security vulnerabilities found"
          else
            echo "⚠️ Security vulnerabilities detected"
            echo "Running npm audit fix to attempt automatic fixes"
            
            # Attempt to fix vulnerabilities automatically
            npm audit fix --audit-level=moderate || echo "❌ Some vulnerabilities could not be automatically fixed"
            
            # Re-run audit to show remaining issues
            npm audit --audit-level=moderate || echo "❌ Manual security review required"
          fi
          
          echo "::endgroup::"
      
      # Step 10: Application startup verification
      # Ensures the application can start successfully
      - name: Verify application startup
        run: |
          echo "::group::Verifying application startup"
          echo "🚀 Testing application startup and basic functionality"
          
          # Start the application in background and test basic functionality
          timeout 30s npm start &
          APP_PID=$!
          
          # Wait for application to start
          sleep 5
          
          # Test basic endpoint functionality
          if curl -f http://localhost:3000/hello > /dev/null 2>&1; then
            echo "✅ Application startup successful"
            echo "✅ Hello endpoint responding correctly"
          else
            echo "❌ Application startup failed or endpoint not responding"
            exit 1
          fi
          
          # Clean up background process
          kill $APP_PID 2>/dev/null || true
          
          echo "::endgroup::"
      
      # Step 11: Performance benchmark
      # Runs basic performance tests to ensure response times meet requirements
      - name: Run performance benchmark
        run: |
          echo "::group::Running performance benchmark"
          echo "⚡ Testing application performance characteristics"
          
          # Start application for performance testing
          timeout 60s npm start &
          APP_PID=$!
          
          # Wait for application to start
          sleep 5
          
          # Run basic performance test
          echo "📊 Testing response time (target: < 100ms)"
          for i in {1..5}; do
            RESPONSE_TIME=$(curl -o /dev/null -s -w "%{time_total}" http://localhost:3000/hello)
            echo "Request $i: ${RESPONSE_TIME}s"
          done
          
          # Test concurrent requests
          echo "📊 Testing concurrent requests"
          for i in {1..10}; do
            curl -s http://localhost:3000/hello > /dev/null &
          done
          wait
          
          echo "✅ Performance benchmark completed"
          
          # Clean up
          kill $APP_PID 2>/dev/null || true
          
          echo "::endgroup::"
      
      # Step 12: Upload coverage reports
      # Uploads coverage reports as workflow artifacts for analysis
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-node-${{ matrix.node-version }}
          path: |
            src/backend/coverage/
            !src/backend/coverage/tmp/
          retention-days: 30
          if-no-files-found: warn
      
      # Step 13: Upload test results
      # Uploads test results for detailed analysis
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            src/backend/test-results.xml
            src/backend/jest-report.json
          retention-days: 30
          if-no-files-found: ignore

  # Summary job that runs after all test jobs complete
  # Provides overall CI pipeline status and summary
  ci-summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    
    steps:
      - name: CI Pipeline Results
        run: |
          echo "::group::CI Pipeline Summary"
          echo "📋 Node.js Tutorial Backend CI Pipeline Results"
          echo "======================================================"
          
          # Check test job results
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All tests passed across Node.js versions 18.x, 20.x, 22.x"
            echo "✅ Code coverage thresholds met"
            echo "✅ Security audit completed successfully"
            echo "✅ Code quality checks passed"
            echo "✅ Application startup verified"
            echo "✅ Performance benchmarks completed"
          else
            echo "❌ CI pipeline failed"
            echo "Please review the test results and fix any issues"
            exit 1
          fi
          
          echo "======================================================"
          echo "🎉 CI Pipeline completed successfully!"
          echo "🚀 Code is ready for deployment"
          echo "::endgroup::"
      
      # Optional: Create deployment-ready tag
      - name: Create deployment tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success'
        run: |
          echo "::group::Creating deployment tag"
          echo "🏷️ Creating deployment-ready tag for successful main branch build"
          
          # Create a timestamp-based tag for deployment tracking
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TAG_NAME="deploy-ready-$TIMESTAMP"
          
          echo "Tag name: $TAG_NAME"
          echo "This tag indicates that the code has passed all CI checks"
          echo "and is ready for deployment to production environments"
          
          echo "::endgroup::"

# Workflow configuration notes:
# - This CI pipeline ensures code quality, security, and functionality
# - Multi-version testing provides compatibility assurance
# - Security auditing prevents vulnerable dependencies
# - Coverage thresholds maintain code quality standards
# - Performance benchmarking ensures response time requirements
# - Artifact uploading provides detailed analysis capabilities
# - Comprehensive logging aids in debugging and monitoring
# - Educational comments explain each step for learning purposes