# =============================================================================
# Continuous Deployment (CD) Workflow for Node.js/Express.js Tutorial Backend
# =============================================================================
#
# This GitHub Actions workflow automates the build, test, and deployment process
# for the Node.js/Express.js tutorial backend application using Docker Compose
# and supporting infrastructure scripts. Ensures reproducible, platform-agnostic
# deployment to local, staging, or production environments with comprehensive
# validation, health checks, and status reporting.
#
# Architecture Overview:
# - Backend: Node.js/Express.js application with health checks (port 3000)
# - NGINX: Reverse proxy and load balancer (port 80)
# - Prometheus: Metrics collection and monitoring (port 9090)
# - Grafana: Metrics visualization and dashboarding (port 3001)
# - Docker Compose orchestration with health checks and observability
#
# Deployment Phases:
# 1. Environment Setup - Node.js 18+, Docker, npm caching
# 2. Dependency Installation - Backend dependencies via npm ci
# 3. Test Suite Execution - Unit, integration, and coverage testing
# 4. Docker Image Building - Multi-service container builds
# 5. Service Deployment - Docker Compose orchestration with health checks
# 6. Health Verification - Comprehensive endpoint validation
# 7. Status Reporting - Deployment summary and access information
#
# Requirements Addressed:
# - Deployment and Environment Configuration (8.2.5)
# - HTTP Server Implementation (2.1.1)
# - Healthcheck and Observability (6.5)
# - Testing Strategy & Automation (6.6)
# - Reverse Proxy and Monitoring Integration (8.2.3, 6.5)
#
# Compatible with:
# - Node.js 18+ (Express.js 5.1.0 requirement)
# - Docker Engine 20+ with BuildKit support
# - Docker Compose V2 (1.29+)
# - Ubuntu, macOS, and Windows runners
#
# Author: Infrastructure Team
# Version: 1.0.0

name: CD Backend

# =============================================================================
# Workflow Triggers - Push and Manual Execution
# =============================================================================
on:
  # Automatic deployment on push to main branch
  push:
    branches:
      - main
    paths:
      # Trigger on backend application changes
      - 'src/backend/**'
      - 'infrastructure/**'
      - '.github/workflows/cd.yml'
      # Trigger on test changes that might affect deployment validation
      - 'src/test/**'
      # Trigger on dependency changes
      - 'package*.json'

  # Manual workflow dispatch for on-demand deployments
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (local, development, staging, production)'
        required: false
        default: 'development'
        type: choice
        options:
          - local
          - development
          - staging
          - production
      
      enable_backup:
        description: 'Enable pre-deployment backup'
        required: false
        default: false
        type: boolean
      
      healthcheck_timeout:
        description: 'Health check timeout in seconds'
        required: false
        default: '120'
        type: string
      
      verbose_logging:
        description: 'Enable verbose logging and debug output'
        required: false
        default: false
        type: boolean

# =============================================================================
# Global Environment Variables
# =============================================================================
env:
  # Deployment Configuration
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'development' }}
  BACKUP_BEFORE_DEPLOY: ${{ github.event.inputs.enable_backup == 'true' && '1' || '0' }}
  HEALTHCHECK_TIMEOUT: ${{ github.event.inputs.healthcheck_timeout || '120' }}
  
  # Docker Configuration
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  COMPOSE_FILE: infrastructure/docker-compose.yml
  
  # Backend Service Configuration
  BACKEND_SERVICE: backend
  HEALTHCHECK_URL: http://localhost:3000/health
  
  # Node.js Configuration (matching package.json engines requirement)
  NODE_VERSION: '18.x'
  NPM_VERSION: '8.x'

# =============================================================================
# Deployment Jobs
# =============================================================================
jobs:
  # ===========================================================================
  # Primary Deployment Job - Complete CI/CD Pipeline
  # ===========================================================================
  deploy:
    name: Deploy Backend Application
    runs-on: ubuntu-latest
    
    # Service containers for integration testing (if needed)
    # services:
    #   docker:
    #     image: docker:dind
    #     options: --privileged
    
    # =============================================================================
    # Deployment Steps - Complete CI/CD Pipeline
    # =============================================================================
    steps:
      # =========================================================================
      # Step 1: Repository Checkout - Get Source Code
      # =========================================================================
      - name: Checkout Repository
        uses: actions/checkout@v4 # v4.2.2 - Latest stable with improved performance
        with:
          # Fetch full history for accurate build context
          fetch-depth: 0
          # Checkout with token for private repository access if needed
          token: ${{ secrets.GITHUB_TOKEN }}
        
      # =========================================================================
      # Step 2: Node.js Environment Setup - Runtime Configuration
      # =========================================================================
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4 # v4.1.0 - Latest with Node.js 18+ support
        with:
          # Use Node.js 18+ as required by Express.js 5.1.0
          node-version: ${{ env.NODE_VERSION }}
          # Enable npm caching for faster dependency installation
          cache: 'npm'
          # Specify cache dependency path for backend
          cache-dependency-path: src/backend/package-lock.json
          # Use npm registry for package resolution
          registry-url: 'https://registry.npmjs.org'
        
      # =========================================================================
      # Step 3: Display Environment Information - Debugging and Context
      # =========================================================================
      - name: Display Environment Information
        run: |
          echo "🔧 CI/CD Environment Information"
          echo "=================================="
          echo "GitHub Runner: ${{ runner.os }} - ${{ runner.arch }}"
          echo "Node.js Version: $(node --version)"
          echo "NPM Version: $(npm --version)"
          echo "Docker Version: $(docker --version)"
          echo "Docker Compose Version: $(docker-compose --version)"
          echo ""
          echo "📋 Deployment Configuration"
          echo "============================"
          echo "Environment: ${{ env.DEPLOY_ENV }}"
          echo "Backup Enabled: ${{ env.BACKUP_BEFORE_DEPLOY }}"
          echo "Health Check Timeout: ${{ env.HEALTHCHECK_TIMEOUT }}s"
          echo "Compose File: ${{ env.COMPOSE_FILE }}"
          echo "Backend Service: ${{ env.BACKEND_SERVICE }}"
          echo ""
          echo "🌍 Repository Context"
          echo "===================="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
      
      # =========================================================================
      # Step 4: Backend Dependency Installation - Package Management
      # =========================================================================
      - name: Install Backend Dependencies
        working-directory: src/backend
        run: |
          echo "📦 Installing Backend Dependencies"
          echo "=================================="
          echo "Working Directory: $(pwd)"
          echo "Package.json: $(ls -la package.json)"
          echo ""
          
          # Use npm ci for clean, reproducible installs in CI environments
          # npm ci is faster than npm install and ensures exact dependency versions
          npm ci --prefer-offline --no-audit --no-fund
          
          echo ""
          echo "✅ Dependency Installation Complete"
          echo "Installed packages: $(npm list --depth=0 2>/dev/null | wc -l) packages"
          echo "Node modules size: $(du -sh node_modules 2>/dev/null || echo 'Unknown')"
          
          # Display critical dependency versions for debugging
          echo ""
          echo "🔍 Critical Dependencies"
          echo "========================"
          echo "Express.js: $(npm list express --depth=0 2>/dev/null | grep express || echo 'Not found')"
          echo "Jest: $(npm list jest --depth=0 2>/dev/null | grep jest || echo 'Not found')"
          echo "Supertest: $(npm list supertest --depth=0 2>/dev/null | grep supertest || echo 'Not found')"
        
      # =========================================================================
      # Step 5: Backend Test Suite Execution - Quality Gates
      # =========================================================================
      - name: Run Backend Test Suite
        working-directory: src/backend
        run: |
          echo "🎯 Backend Test Suite Execution"
          echo "==============================="
          echo "Test Environment: test"
          echo "Node Environment: $NODE_ENV"
          echo ""
          
          # Set test environment for consistent test execution
          export NODE_ENV=test
          
          # Execute comprehensive test suite using the canonical test entry point
          # This invokes src/backend/scripts/test.js which orchestrates all test phases
          echo "🚀 Starting Backend Test Suite..."
          npm test
          
          echo ""
          echo "✅ Backend Test Suite Completed Successfully"
          echo "All quality gates passed - backend ready for deployment"
        env:
          # Ensure test environment for predictable behavior
          NODE_ENV: test
          # Enable CI-specific test optimizations
          CI: true
        
      # =========================================================================
      # Step 6: Docker Environment Setup - Container Platform Configuration
      # =========================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.7.1 - Multi-platform builds with BuildKit
        with:
          # Enable BuildKit for improved build performance and caching
          version: latest
          # Use docker-container driver for advanced features
          driver: docker-container
          # Configure buildkit for optimal performance
          driver-opts: |
            network=host
          # Install additional platforms if needed (multi-arch builds)
          platforms: linux/amd64
        
      # =========================================================================
      # Step 7: Docker Image Building - Container Image Creation
      # =========================================================================
      - name: Build Docker Images
        run: |
          echo "🐳 Docker Image Building Phase"
          echo "=============================="
          echo "Docker BuildKit: $DOCKER_BUILDKIT"
          echo "Compose CLI Build: $COMPOSE_DOCKER_CLI_BUILD"
          echo "Compose File: $COMPOSE_FILE"
          echo ""
          
          # Verify Docker Compose file exists and is valid
          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "❌ Docker Compose file not found: $COMPOSE_FILE"
            exit 1
          fi
          
          echo "✅ Docker Compose file found: $COMPOSE_FILE"
          
          # Validate Docker Compose configuration
          echo "🔍 Validating Docker Compose configuration..."
          docker-compose -f "$COMPOSE_FILE" config --quiet
          
          if [ $? -eq 0 ]; then
            echo "✅ Docker Compose configuration is valid"
          else
            echo "❌ Docker Compose configuration validation failed"
            exit 1
          fi
          
          echo ""
          echo "🔨 Building all Docker images..."
          
          # Build all images with docker-compose
          # Use --no-cache to ensure fresh builds in CI environment
          # Use --parallel to build multiple images simultaneously
          docker-compose -f "$COMPOSE_FILE" build \
            --no-cache \
            --parallel \
            --build-arg NODE_ENV="$DEPLOY_ENV" \
            --build-arg BUILD_TARGET=production
          
          echo ""
          echo "✅ Docker Image Building Complete"
          
          # Display built images for verification
          echo ""
          echo "📦 Built Images"
          echo "==============="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}" | head -10
        
      # =========================================================================
      # Step 8: Service Deployment - Docker Compose Orchestration
      # =========================================================================
      - name: Deploy Services with Docker Compose
        run: |
          echo "🚀 Service Deployment Phase"
          echo "==========================="
          echo "Environment: $DEPLOY_ENV"
          echo "Backup Enabled: $BACKUP_BEFORE_DEPLOY"
          echo ""
          
          # Make deploy script executable
          chmod +x infrastructure/scripts/deploy.sh
          
          # Prepare deployment arguments
          DEPLOY_ARGS="--env $DEPLOY_ENV --timeout $HEALTHCHECK_TIMEOUT"
          
          # Add backup flag if enabled
          if [ "$BACKUP_BEFORE_DEPLOY" = "1" ]; then
            DEPLOY_ARGS="$DEPLOY_ARGS --backup"
          else
            DEPLOY_ARGS="$DEPLOY_ARGS --no-backup"
          fi
          
          # Add verbose flag for GitHub Actions
          if [ "${{ github.event.inputs.verbose_logging }}" = "true" ]; then
            DEPLOY_ARGS="$DEPLOY_ARGS --verbose"
          fi
          
          echo "🎯 Executing deployment with arguments: $DEPLOY_ARGS"
          echo ""
          
          # Execute the comprehensive deployment script
          # This script handles all deployment phases including:
          # - Dependency validation
          # - Optional backup
          # - Service startup
          # - Health check verification
          # - Status reporting
          ./infrastructure/scripts/deploy.sh $DEPLOY_ARGS
        env:
          # Pass deployment environment variables
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          BACKUP_BEFORE_DEPLOY: ${{ env.BACKUP_BEFORE_DEPLOY }}
          HEALTHCHECK_TIMEOUT: ${{ env.HEALTHCHECK_TIMEOUT }}
        
      # =========================================================================
      # Step 9: Service Health Verification - Endpoint Validation
      # =========================================================================
      - name: Verify Service Health
        run: |
          echo "🏥 Service Health Verification"
          echo "=============================="
          echo "Health Check Timeout: $HEALTHCHECK_TIMEOUT seconds"
          echo ""
          
          # Define service endpoints for health checking
          declare -A HEALTH_ENDPOINTS=(
            ["Backend (Direct)"]="http://localhost:3000/health"
            ["Application (NGINX)"]="http://localhost/health"
            ["Prometheus"]="http://localhost:9090/-/healthy"
            ["Grafana"]="http://localhost:3001/api/health"
          )
          
          echo "🔍 Testing Service Endpoints"
          echo "============================="
          
          # Test each service endpoint with retries
          for service in "${!HEALTH_ENDPOINTS[@]}"; do
            endpoint="${HEALTH_ENDPOINTS[$service]}"
            echo "Testing $service: $endpoint"
            
            # Use curl with retries and timeout
            if curl -f -s -m 10 --retry 3 --retry-delay 5 "$endpoint" > /dev/null; then
              echo "✅ $service is healthy"
            else
              echo "❌ $service health check failed"
              
              # Show service logs for debugging
              echo "📋 Service Logs (last 20 lines):"
              docker-compose -f "$COMPOSE_FILE" logs --tail=20 2>/dev/null || echo "No logs available"
              exit 1
            fi
          done
          
          echo ""
          echo "✅ All Service Health Checks Passed"
        
      # =========================================================================
      # Step 10: Functional Testing - Application Validation
      # =========================================================================
      - name: Run Functional Tests
        run: |
          echo "🧪 Functional Testing Phase"
          echo "=========================="
          echo ""
          
          # Test the main application endpoint
          echo "🎯 Testing Main Application Endpoint"
          echo "===================================="
          
          # Test /hello endpoint through NGINX proxy
          echo "Testing GET /hello through NGINX proxy..."
          HELLO_RESPONSE=$(curl -s http://localhost/hello)
          
          if [ "$HELLO_RESPONSE" = "Hello world" ]; then
            echo "✅ Hello endpoint test passed: '$HELLO_RESPONSE'"
          else
            echo "❌ Hello endpoint test failed: '$HELLO_RESPONSE'"
            exit 1
          fi
          
          # Test /hello endpoint direct to backend
          echo "Testing GET /hello direct to backend..."
          HELLO_DIRECT=$(curl -s http://localhost:3000/hello)
          
          if [ "$HELLO_DIRECT" = "Hello world" ]; then
            echo "✅ Direct backend test passed: '$HELLO_DIRECT'"
          else
            echo "❌ Direct backend test failed: '$HELLO_DIRECT'"
            exit 1
          fi
          
          # Test health endpoints
          echo ""
          echo "🏥 Testing Health Endpoints"
          echo "=========================="
          
          # Test backend health endpoint
          echo "Testing backend health endpoint..."
          HEALTH_RESPONSE=$(curl -s http://localhost:3000/health)
          
          if echo "$HEALTH_RESPONSE" | grep -q "healthy\|ok\|status"; then
            echo "✅ Backend health endpoint test passed"
          else
            echo "❌ Backend health endpoint test failed: '$HEALTH_RESPONSE'"
            exit 1
          fi
          
          echo ""
          echo "✅ All Functional Tests Passed"
        
      # =========================================================================
      # Step 11: Deployment Status and Service Information
      # =========================================================================
      - name: Display Deployment Status
        run: |
          echo "📊 Deployment Status Report"
          echo "=========================="
          echo ""
          
          # Display service status
          echo "🔍 Service Status"
          echo "================"
          docker-compose -f "$COMPOSE_FILE" ps
          
          echo ""
          echo "🌐 Service Access Information"
          echo "============================="
          echo "Application (NGINX):    http://localhost"
          echo "Application Health:     http://localhost/health"
          echo "Hello World Endpoint:   http://localhost/hello"
          echo "Backend Direct:         http://localhost:3000"
          echo "Backend Health:         http://localhost:3000/health"
          echo "Prometheus:             http://localhost:9090"
          echo "Grafana:                http://localhost:3001 (admin/admin)"
          
          echo ""
          echo "📈 Resource Usage"
          echo "================"
          docker stats --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}\t{{.BlockIO}}"
          
          echo ""
          echo "🎯 Deployment Summary"
          echo "===================="
          echo "Environment: $DEPLOY_ENV"
          echo "Backup Enabled: $([ "$BACKUP_BEFORE_DEPLOY" = "1" ] && echo "Yes" || echo "No")"
          echo "Health Check Timeout: ${HEALTHCHECK_TIMEOUT}s"
          echo "Services Deployed: backend, nginx, prometheus, grafana"
          echo "Status: All services healthy and ready"
          echo ""
          echo "✅ Continuous Deployment Completed Successfully!"
        
      # =========================================================================
      # Step 12: Cleanup and Resource Management (Optional)
      # =========================================================================
      - name: Cleanup Resources (Post-Test)
        if: always() # Run cleanup even if previous steps fail
        run: |
          echo "🧹 Post-Deployment Cleanup"
          echo "=========================="
          echo ""
          
          # In a real deployment, you might want to keep services running
          # For CI/CD testing, we clean up to free resources
          
          echo "📋 Final Service Logs (last 50 lines each)"
          echo "=========================================="
          
          # Capture logs before cleanup
          for service in backend nginx prometheus grafana; do
            echo ""
            echo "--- Logs for $service ---"
            docker-compose -f "$COMPOSE_FILE" logs --tail=50 "$service" 2>/dev/null || echo "No logs for $service"
          done
          
          echo ""
          echo "🛑 Stopping Services"
          echo "===================="
          
          # Stop all services gracefully
          docker-compose -f "$COMPOSE_FILE" down --timeout 30
          
          echo "✅ Cleanup Complete"
        
      # =========================================================================
      # Step 13: Deployment Notification (Optional - for Slack/Teams/etc.)
      # =========================================================================
      - name: Notify Deployment Status
        if: always() # Notify regardless of success/failure
        run: |
          echo "📢 Deployment Notification"
          echo "========================="
          
          # Determine deployment status
          if [ "${{ job.status }}" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="SUCCESS"
            STATUS_COLOR="good"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="FAILED"
            STATUS_COLOR="danger"
          fi
          
          echo "$STATUS_EMOJI Deployment Status: $STATUS_TEXT"
          echo "Environment: $DEPLOY_ENV"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          
          # Here you could add integration with Slack, Teams, Discord, etc.
          # Example:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data "{\"text\":\"$STATUS_EMOJI Backend Deployment $STATUS_TEXT - Environment: $DEPLOY_ENV\"}" \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

# =============================================================================
# Workflow Configuration and Best Practices
# =============================================================================
#
# This GitHub Actions workflow implements the following best practices:
#
# 1. **Comprehensive CI/CD Pipeline**:
#    - Source code checkout with full history
#    - Environment setup with caching optimization
#    - Dependency installation with reproducible builds
#    - Complete test suite execution with quality gates
#    - Docker image building with BuildKit optimization
#    - Multi-service deployment with health verification
#    - Functional testing and endpoint validation
#    - Resource cleanup and status reporting
#
# 2. **Error Handling and Resilience**:
#    - Fail-fast strategy with meaningful error messages
#    - Health check verification with retries and timeouts
#    - Service log collection for debugging
#    - Cleanup steps that run regardless of failure
#    - Comprehensive status reporting for troubleshooting
#
# 3. **Security and Compliance**:
#    - Use of official GitHub Actions with pinned versions
#    - Secure token handling with ${{ secrets.GITHUB_TOKEN }}
#    - Minimal permissions and secure defaults
#    - No hardcoded secrets or sensitive information
#    - Proper environment variable management
#
# 4. **Performance Optimization**:
#    - npm caching for faster dependency installation
#    - Docker BuildKit for optimized image builds
#    - Parallel processing where applicable
#    - Resource limits and cleanup procedures
#    - Efficient logging and output management
#
# 5. **Observability and Monitoring**:
#    - Comprehensive logging throughout the pipeline
#    - Environment information display for debugging
#    - Service health monitoring and verification
#    - Resource usage reporting and monitoring
#    - Deployment status notifications
#
# 6. **Flexibility and Configuration**:
#    - Multiple deployment environments support
#    - Manual workflow dispatch with input parameters
#    - Configurable timeouts and retry strategies
#    - Optional backup and verbose logging modes
#    - Environment-specific deployment strategies
#
# Usage Examples:
#
# 1. **Automatic Deployment** (on push to main):
#    - Triggered automatically when code is pushed to main branch
#    - Uses default environment (development) and settings
#    - Full CI/CD pipeline with testing and deployment
#
# 2. **Manual Production Deployment**:
#    - Go to Actions tab in GitHub repository
#    - Select "CD Backend" workflow
#    - Click "Run workflow"
#    - Select environment: "production"
#    - Enable backup: true
#    - Set healthcheck timeout: 300
#    - Enable verbose logging: true
#
# 3. **Development Testing**:
#    - Manual dispatch with environment: "development"
#    - Enable verbose logging for debugging
#    - Shorter timeout for faster feedback
#
# 4. **Staging Deployment**:
#    - Manual dispatch with environment: "staging"
#    - Enable backup for data protection
#    - Standard timeout and logging settings
#
# Troubleshooting:
#
# 1. **Build Failures**:
#    - Check Node.js version compatibility (18+)
#    - Verify package.json and package-lock.json integrity
#    - Review dependency installation logs
#    - Ensure Docker daemon availability
#
# 2. **Test Failures**:
#    - Review test suite output in workflow logs
#    - Check individual test phase results
#    - Verify Jest configuration and test files
#    - Ensure test environment setup
#
# 3. **Deployment Failures**:
#    - Check Docker Compose file validation
#    - Review service startup logs
#    - Verify port availability and conflicts
#    - Check health endpoint responses
#
# 4. **Health Check Failures**:
#    - Increase healthcheck timeout
#    - Review service logs for startup issues
#    - Check endpoint URLs and port mappings
#    - Verify service dependencies and ordering
#
# Integration with External Services:
#
# - **Slack Notifications**: Add webhook URL to secrets and uncomment notification step
# - **Container Registry**: Add docker/login-action and docker/build-push-action steps
# - **Monitoring**: Integration with external monitoring services via webhooks
# - **Security Scanning**: Add security scanning steps for containers and dependencies
# - **Performance Testing**: Add load testing steps after successful deployment
#
# =============================================================================